<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Outline&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <title>Polish ALL the Things! | Care of Jewelry</title>
    <link href="/src/index.css" rel="stylesheet">

</head>
<body class="font-body">

{{> navbar }}

<!-- Logo -->
<img class="h-auto w-full" src="/logo.png" alt="Polish ALL the Things! Logo">

<div class="bg-gradient-to-b from-fuchsia-500 via-yellow-500 via-green-500 to-blue-500">

    <!-- Press-On Guide Heading -->
    <h4 id="pressOnGuide" class="pt-8 mb-7 text-4xl font-bold font-heading text-center text-text">Press-On Guide</h4>

    <div class="flex justify-center px-4">
        <!-- Press-On Guide -->
        <section class="block w-full max-w-3xl p-6 bg-white border border-black rounded-lg shadow-sm hover:bg-gray-100">
            <h5 class="p-4">Are you unsure of what Shape or Length of nail you'd like to try?  Fill out this form for help when choosing your sizing guide!</h5>
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdVs7JjheETAr5crjqjvE77nqsGRDsG-wCXbPHu5UbV6T43sQ/viewform?embedded=true"
                    class="w-full"
                    style="min-height: 1200px; height: auto; border: none;"
                    frameborder="0"
                    marginheight="0"
                    marginwidth="0">Loading…</iframe>
        </section>
    </div>

{{> footer }}
</div>

{{> back-to-top }}

<!--Sticky Menus-->
<script type="module" src="/src/main.js"></script>
<script type="module">
  import { initFlowbite } from 'flowbite';

  // Initialize Flowbite when the page loads
  document.addEventListener('DOMContentLoaded', () => {
    initFlowbite();
  });
</script>

</body>
</html>
